name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files
        run: ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android project
        run: |
          S=$(find . -iname 'setup-android*.sh' | head -1)
          echo "script: $S"
          bash "$S"
      - name: Build debug APK
        run: |
          D=$(dirname "$(find . -name gradlew -not -path '*/node_modules/*' | head -1)")
          cd "$D"
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1 || { echo "=== ERRORS ==="; grep -n -A2 "error" "$GITHUB_WORKSPACE/build.log" | head -50; echo "=== TAIL ==="; tail -25 "$GITHUB_WORKSPACE/build.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: NetBoost-apk
          path: "**/app-debug.apk"
